          type: string
          description: Defaults to active.
          example: active
          enum: [active, inactive]
        template:
          type: string
          description: Callback template name. Defaults to custom.
          example: custom
        payload_type:
          type: string
          description: Defaults to SIMPLIFIED.
          example: SIMPLIFIED
        payload_transform:
          type: string
          description: Defaults to standard.
          example: standard
        identity_id:
          type: string
          description: Optional entity or bot filter.
        header_key:
          type: array
          items:
            type: string
            description: Custom header name.
        header_value:
          type: array
          items:
            type: string
            description: Custom header value.
        payload:
          oneOf:
            - type: string
              description: Callback template as text.
            - type: object
              additionalProperties: true
      additionalProperties: true
