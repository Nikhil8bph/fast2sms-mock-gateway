openapi: "3.1.0"
info:
  title: Fast2SMS Sandbox API
  version: "1.0"
  description: "Independent development and testing gateway. Accepted messaging requests are queued for email delivery. Use **Authorize** with a configured sandbox key and enter the key exactly as supplied. Requests that write state, including the GET send endpoints, can queue email. Use sandbox data in the examples."
externalDocs:
  description: Official Fast2SMS API reference
  url: "https://docs.fast2sms.com/reference/"
servers:
  - url: "/"
    description: Current sandbox host
tags:
  - name: SMS
  - name: Smart OTP
  - name: WhatsApp messages
  - name: Reports and wallet
  - name: RCS
  - name: Voice
  - name: DLT Manager
  - name: WhatsApp account and templates
  - name: WhatsApp media and QR
  - name: Webhook configuration
  - name: Health
security:
  - fast2smsKey: []
paths:
  /dev/bulkV2:
    get:
      tags: [SMS]
      operationId: sendSmsQuery
      summary: Send SMS with query parameters
      description: Quick and DLT Manual SMS use message text. DLT SMS uses a message ID and may include variables_values. Classic OTP uses variables_values for the code. DLT routes require sender_id. DLT Manual may resolve missing IDs from a unique saved template.
      parameters:
        - name: route
          in: query
          required: true
          schema:
            type: string
            description: SMS route.
            example: q
            enum: [q, dlt, dlt_manual, otp]
        - name: numbers
          in: query
          required: true
          schema:
            type: string
            description: Comma-separated Indian mobile numbers.
            example: "9999999999"
        - name: message
          in: query
          schema:
            type: string
            description: "Quick SMS text, full DLT Manual text, or the Fast2SMS DLT message ID."
            example: Hello from the sandbox
        - name: sender_id
          in: query
          schema:
            type: string
            description: DLT sender ID.
            example: TESTER
        - name: entity_id
          in: query
          schema:
            type: string
            description: DLT principal entity ID.
        - name: template_id
          in: query
          schema:
            type: string
            description: DLT template ID.
        - name: variables_values
          in: query
          schema:
            type: string
            description: Pipe-delimited template values.
            example: "Sandbox|123456"
        - name: schedule_time
          in: query
          schema:
            type: string
            description: "Future time in Asia/Kolkata as DD-MM-YYYY-HH-MM, or Unix seconds."
        - name: sms_details
          in: query
          schema:
            type: string
            description: Set to 1 to include message details.
            example: "1"
            enum: ["1"]
        - name: udf1
          in: query
          schema:
            type: string
            description: First tracking value
        - name: udf2
          in: query
          schema:
            type: string
            description: Second tracking value
        - name: udf3
          in: query
          schema:
            type: string
            description: Third tracking value
      responses:
        "200":
          $ref: "#/components/responses/SmsAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [SMS]
      operationId: sendSms
      summary: "Send Quick, DLT, DLT Manual, or classic OTP SMS"
      description: Quick and DLT Manual SMS use message text. DLT SMS uses a message ID and may include variables_values. Classic OTP uses variables_values for the code. DLT routes require sender_id. DLT Manual may resolve missing IDs from a unique saved template.
      requestBody:
        description: SMS payload.
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/QuickSmsRequest"
                - $ref: "#/components/schemas/DltSmsRequest"
                - $ref: "#/components/schemas/DltManualSmsRequest"
                - $ref: "#/components/schemas/ClassicOtpSmsRequest"
            examples:
              quick:
                summary: Quick SMS
                value:
                  route: q
                  numbers: "9999999999"
                  message: Hello from the sandbox
              dlt:
                summary: DLT template
                value:
                  route: dlt
                  numbers: "9999999999"
                  sender_id: TESTER
                  message: "10001"
                  variables_values: Sandbox
              manual:
                summary: DLT Manual
                value:
                  route: dlt_manual
                  numbers: "9999999999"
                  sender_id: TESTER
                  message: Order 112 is ready.
                  template_id: "2001003001"
                  entity_id: "2001002001"
              otp:
                summary: Classic OTP
                value:
                  route: otp
                  numbers: "9999999999"
                  variables_values: "012345"
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [route, numbers]
              properties:
                route:
                  type: string
                  description: SMS route.
                  example: q
                  enum: [q, dlt, dlt_manual, otp]
                numbers:
                  type: string
                  description: Comma-separated Indian mobile numbers.
                  example: "9999999999"
                message:
                  type: string
                  description: "Quick SMS text, full DLT Manual text, or the Fast2SMS DLT message ID."
                  example: Hello from the sandbox
                sender_id:
                  type: string
                  description: DLT sender ID.
                  example: TESTER
                entity_id:
                  type: string
                  description: DLT principal entity ID.
                template_id:
                  type: string
                  description: DLT template ID.
                variables_values:
                  type: string
                  description: Pipe-delimited template values.
                  example: "Sandbox|123456"
                schedule_time:
                  type: string
                  description: "Future time in Asia/Kolkata as DD-MM-YYYY-HH-MM, or Unix seconds."
                sms_details:
                  type: string
                  description: Set to 1 to include message details.
                  example: "1"
                  enum: ["1"]
                udf1:
                  type: string
                  description: First tracking value
                udf2:
                  type: string
                  description: Second tracking value
                udf3:
                  type: string
                  description: Third tracking value
      responses:
        "200":
          $ref: "#/components/responses/SmsAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/custom:
    post:
      tags: [SMS]
      operationId: sendSmsBatch
      summary: Send a batch of SMS requests
      description: "Supply the sender ID in each DLT item. For DLT Manual, include entity_id and template_id on every item. Items with different schedules get separate emails under the same request ID."
      requestBody:
        description: Batch payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsBatchRequest"
            example:
              route: q
              requests:
                - numbers: "9999999999"
                  message: First message
                - numbers: "9999999998"
                  message: Second message
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/otp/send:
    post:
      tags: [Smart OTP]
      operationId: sendSmartOtp
      summary: Send a Smart OTP
      description: A new send replaces the previous code for the number. The sandbox emails the code to the configured inbox.
      requestBody:
        description: Smart OTP payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
            example:
              mobile: "9999999999"
              otp_id: sandbox-otp
              otp_expiry: 5
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          $ref: "#/components/responses/OtpSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Smart OTP]
      operationId: sendSmartOtpQuery
      summary: Send a Smart OTP with query parameters
      description: A new send replaces the previous code for the number. The sandbox emails the code to the configured inbox.
      parameters:
        - name: mobile
          in: query
          required: true
          schema:
            type: string
            description: "Indian mobile number. An optional 91 or +91 prefix is accepted."
            example: "9999999999"
        - name: otp_id
          in: query
          required: true
          schema:
            type: string
            description: Sandbox OTP template ID.
            example: sandbox-otp
        - name: otp
          in: query
          schema:
            type: string
            description: Optional test code. Supply a string to retain leading zeros.
            example: "012345"
            maxLength: 10
        - name: otp_length
          in: query
          schema:
            type: integer
            description: Generated code length.
            example: 6
            minimum: 4
            maximum: 10
            default: 6
        - name: otp_expiry
          in: query
          schema:
            type: integer
            description: Minutes of validity.
            example: 15
            minimum: 1
            maximum: 10080
            default: 15
        - name: variables_values
          in: query
          schema:
            type: string
            description: Pipe-delimited template values.
            example: "Sandbox|123456"
        - name: udf1
          in: query
          schema:
            type: string
            description: First tracking value
        - name: udf2
          in: query
          schema:
            type: string
            description: Second tracking value
        - name: udf3
          in: query
          schema:
            type: string
            description: Third tracking value
      responses:
        "200":
          $ref: "#/components/responses/OtpSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/otp/verify:
    post:
      tags: [Smart OTP]
      operationId: verifySmartOtp
      summary: Verify a Smart OTP
      description: "Verify the latest unused code. Invalid, expired, and exhausted codes are reported separately."
      requestBody:
        description: Smart OTP payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
            example:
              mobile: "9999999999"
              otp: "012345"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          $ref: "#/components/responses/OtpVerified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Smart OTP]
      operationId: verifySmartOtpQuery
      summary: Verify a Smart OTP with query parameters
      description: "Verify the latest unused code. Invalid, expired, and exhausted codes are reported separately."
      parameters:
        - name: mobile
          in: query
          required: true
          schema:
            type: string
            description: "Indian mobile number. An optional 91 or +91 prefix is accepted."
            example: "9999999999"
        - name: otp
          in: query
          required: true
          schema:
            type: string
            description: Code from the sandbox email.
            example: "012345"
      responses:
        "200":
          $ref: "#/components/responses/OtpVerified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/otp/resend:
    post:
      tags: [Smart OTP]
      operationId: resendSmartOtp
      summary: Resend a Smart OTP
      description: Reuse the latest code and restart its expiry. The resend window and cooldown still apply.
      requestBody:
        description: Smart OTP payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendOtpRequest"
            example:
              mobile: "9999999999"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ResendOtpRequest"
      responses:
        "200":
          $ref: "#/components/responses/OtpSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Smart OTP]
      operationId: resendSmartOtpQuery
      summary: Resend a Smart OTP with query parameters
      description: Reuse the latest code and restart its expiry. The resend window and cooldown still apply.
      parameters:
        - name: mobile
          in: query
          required: true
          schema:
            type: string
            description: "Indian mobile number. An optional 91 or +91 prefix is accepted."
            example: "9999999999"
      responses:
        "200":
          $ref: "#/components/responses/OtpSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/whatsapp:
    get:
      tags: [WhatsApp messages]
      operationId: sendWhatsAppTemplateQuery
      summary: Send a WhatsApp template with query parameters
      parameters:
        - name: message_id
          in: query
          required: true
          schema:
            type: string
            description: Numeric Fast2SMS template message ID.
            example: "20005"
        - name: phone_number_id
          in: query
          schema:
            type: string
            description: Optional sender phone number ID.
            example: "100000000000002"
        - name: numbers
          in: query
          required: true
          schema:
            type: string
            description: Comma-separated Indian mobile numbers.
            example: "9999999999"
        - name: variables_values
          in: query
          schema:
            type: string
            description: Pipe-delimited template values.
            example: "Sandbox|123456"
        - name: media_url
          in: query
          schema:
            type: string
            description: HTTP or HTTPS media URL. The sandbox records it in the payload.
        - name: document_filename
          in: query
          schema:
            type: string
            description: Filename for a document header.
        - name: schedule_time
          in: query
          schema:
            type: string
            description: "Future time in Asia/Kolkata as DD-MM-YYYY-HH-MM, or Unix seconds."
        - name: sms_details
          in: query
          schema:
            type: string
            description: Set to 1 to include message details.
            example: "1"
            enum: ["1"]
        - name: udf1
          in: query
          schema:
            type: string
            description: First tracking value
        - name: udf2
          in: query
          schema:
            type: string
            description: Second tracking value
        - name: udf3
          in: query
          schema:
            type: string
            description: Third tracking value
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/FieldBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [WhatsApp messages]
      operationId: sendWhatsAppTemplate
      summary: Send a WhatsApp template by message ID
      requestBody:
        description: Fast2SMS-style template payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppTemplateRequest"
            example:
              message_id: "20005"
              phone_number_id: "100000000000002"
              numbers: "9999999999"
              variables_values: Sandbox
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WhatsAppTemplateRequest"
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/FieldBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/whatsapp-session:
    post:
      tags: [WhatsApp messages]
      operationId: sendWhatsAppSession
      summary: Send a WhatsApp session message
      description: Use the flat fields shown in the examples or a nested object named for the message type. The sandbox queues an email for the supplied message.
      requestBody:
        description: Session payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppSessionRequest"
            examples:
              text:
                summary: Text
                value:
                  phone_number_id: "100000000000002"
                  to: "9999999999"
                  type: text
                  text: Hello from the sandbox
              image:
                summary: Image
                value:
                  phone_number_id: "100000000000002"
                  to: "9999999999"
                  type: image
                  url: "https://example.test/sandbox.png"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WhatsAppSessionForm"
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/FieldBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/whatsapp-direct-send:
    post:
      tags: [WhatsApp messages]
      operationId: sendWhatsAppDirect
      summary: Send a sandbox utility message
      description: Sandbox contract for the Direct Send route.
      requestBody:
        description: Utility message payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppDirectRequest"
            example:
              phone_number_id: "100000000000002"
              category: utility
              text: Your sandbox order is ready.
              numbers: "9999999999"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WhatsAppDirectRequest"
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/FieldBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/whatsapp/{version}/{phone_number_id}/messages:
    parameters:
      - $ref: "#/components/parameters/Version"
      - $ref: "#/components/parameters/PhoneId"
    post:
      tags: [WhatsApp messages]
      operationId: sendWhatsAppMeta
      summary: Send a WhatsApp message in Meta format
      requestBody:
        description: Meta-style payload.
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/WhatsAppMetaText"
                - $ref: "#/components/schemas/WhatsAppMetaTemplate"
                - $ref: "#/components/schemas/WhatsAppMetaAsset"
            examples:
              text:
                summary: Text
                value:
                  messaging_product: whatsapp
                  to: "919999999999"
                  type: text
                  text:
                    body: Hello from the sandbox
              template:
                summary: Template
                value:
                  messaging_product: whatsapp
                  to: "919999999999"
                  type: template
                  template:
                    name: sandbox_template
                    language:
                      code: en
              media:
                summary: Image
                value:
                  messaging_product: whatsapp
                  to: "919999999999"
                  type: image
                  image:
                    link: "https://example.test/image.png"
      responses:
        "200":
          $ref: "#/components/responses/WhatsAppMetaAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/rcs:
    get:
      tags: [RCS]
      operationId: sendRcsQuery
      summary: "Send a plain, rich, or media RCS message with query parameters"
      description: "For plain or rich text, include message. Media requires media_url. Carousels use POST JSON with 2 to 10 cards."
      parameters:
        - name: bot_id
          in: query
          required: true
          schema:
            type: string
            description: RCS bot ID.
            example: sandbox-bot
        - name: to
          in: query
          required: true
          schema:
            type: string
            description: "Indian mobile number. An optional 91 or +91 prefix is accepted."
            example: "9999999999"
        - name: type
          in: query
          required: true
          schema:
            type: string
            description: RCS format.
            example: plain
            enum: [plain, rich, media]
        - name: title
          in: query
          schema:
            type: string
            description: Optional title for a rich card.
            maxLength: 100
        - name: message
          in: query
          schema:
            type: string
            description: Message text.
            example: Hello from the sandbox
            maxLength: 3000
        - name: media_url
          in: query
          schema:
            type: string
            description: HTTP or HTTPS media URL.
            example: "https://example.test/image.png"
        - name: suggestion_type
          in: query
          schema:
            type: string
            description: Optional action type.
            enum: [openUrl, dial, viewLocation]
        - name: suggestion_text
          in: query
          schema:
            type: string
            description: Action button label.
            maxLength: 25
        - name: suggestion_url
          in: query
          schema:
            type: string
            description: HTTP or HTTPS URL for openUrl.
        - name: suggestion_phone
          in: query
          schema:
            type: string
            description: International phone number for dial.
        - name: latitude
          in: query
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: location_label
          in: query
          schema:
            type: string
            description: Optional map label.
        - name: udf1
          in: query
          schema:
            type: string
            description: First tracking value
        - name: udf2
          in: query
          schema:
            type: string
            description: Second tracking value
        - name: udf3
          in: query
          schema:
            type: string
            description: Third tracking value
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/FieldBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [RCS]
      operationId: sendRcs
      summary: "Send a plain, rich, media, or carousel RCS message"
      description: "For plain or rich text, include message. Media requires media_url. Carousels use POST JSON with 2 to 10 cards."
      requestBody:
        description: RCS payload.
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/RcsPlain"
                - $ref: "#/components/schemas/RcsRich"
                - $ref: "#/components/schemas/RcsMedia"
                - $ref: "#/components/schemas/RcsCarousel"
            examples:
              plain:
                summary: Plain text
                value:
                  bot_id: sandbox-bot
                  to: "9999999999"
                  type: plain
                  message: Hello from the sandbox
              rich:
                summary: Rich card
                value:
                  bot_id: sandbox-bot
                  to: "9999999999"
                  type: rich
                  title: Sandbox
                  message: Hello from the sandbox
                  media_url: "https://example.test/image.png"
              media:
                summary: Media
                value:
                  bot_id: sandbox-bot
                  to: "9999999999"
                  type: media
                  media_url: "https://example.test/image.png"
              carousel:
                summary: Carousel
                value:
                  bot_id: sandbox-bot
                  to: "9999999999"
                  type: carousel
                  cards:
                    - title: First
                      description: Sandbox card one
                    - title: Second
                      description: Sandbox card two
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/FieldBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/voice/bulk:
    post:
      tags: [Voice]
      operationId: submitVoiceCampaign
      summary: Submit a voice campaign
      requestBody:
        description: "Simple, key-press, or call-patch campaign payload."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceCampaignRequest"
            example:
              file_id: "30023"
              numbers: "9999999999,9999999998"
              campaign_name: Sandbox test
              idempotency_key: test-campaign-001
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/VoiceCampaignRequest"
      responses:
        "200":
          $ref: "#/components/responses/VoiceCampaignAccepted"
        "400":
