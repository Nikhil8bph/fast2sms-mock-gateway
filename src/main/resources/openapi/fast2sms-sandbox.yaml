    delete:
      tags: [WhatsApp media and QR]
      operationId: unblockWhatsAppUsers
      summary: Unblock WhatsApp users
      requestBody:
        description: Users to unblock in the sandbox.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppBlockRequest"
            example:
              messaging_product: whatsapp
              block_users:
                - user: "+919999999999"
      responses:
        "200":
          $ref: "#/components/responses/WhatsAppUnblocked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/webhook/v2/{service}:
    parameters:
      - $ref: "#/components/parameters/WebhookService"
    get:
      tags: [Webhook configuration]
      operationId: listWebhooks
      summary: List webhook configurations for a channel
      responses:
        "200":
          $ref: "#/components/responses/WebhookList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Webhook configuration]
      operationId: createWebhook
      summary: Create a webhook configuration
      description: Configurations are saved for testing. Sandbox delivery goes to the configured email inbox.
      requestBody:
        description: Webhook configuration.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
            example:
              name: Sandbox callback
              url: "https://example.test/webhook"
              event: all
              method: POST
      responses:
        "200":
          $ref: "#/components/responses/WebhookSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /dev/webhook/v2/{service}/{id}:
    parameters:
      - $ref: "#/components/parameters/WebhookService"
      - $ref: "#/components/parameters/WebhookId"
    put:
      tags: [Webhook configuration]
      operationId: replaceWebhook
      summary: Replace a webhook configuration
      description: Include settings you want to keep. Omitted settings revert to their defaults.
      requestBody:
        description: Webhook configuration.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
            example:
              name: Sandbox callback
              url: "https://example.test/webhook"
              event: all
              method: POST
      responses:
        "200":
          $ref: "#/components/responses/WebhookSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Webhook configuration]
      operationId: deleteWebhook
      summary: Delete a webhook configuration
      responses:
        "200":
          $ref: "#/components/responses/WebhookDeleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check sandbox application health
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
components:
  securitySchemes:
    fast2smsKey:
      type: apiKey
      in: header
      name: Authorization
      description: Raw API key configured in FAST2SMS_API_KEYS.
  parameters:
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
        description: WhatsApp API version.
        example: v26.0
        pattern: "^v[0-9]+[.][0-9]+$"
    WabaId:
      name: waba_id
      in: path
      required: true
      schema:
        type: string
        description: WhatsApp Business Account ID.
        example: "100000000000001"
    PhoneId:
      name: phone_number_id
      in: path
      required: true
      schema:
        type: string
        description: WhatsApp phone number ID.
        example: "100000000000002"
    WhatsAppObjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: "Business account, phone number, or template ID. POST takes a template ID."
        example: "20005"
    SmsRequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        description: Request ID from an SMS send.
        example: S1234567890abcd
    WhatsAppRequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        description: Request ID or Meta message ID from a WhatsApp send.
        example: W1234567890abcd
    MediaId:
      name: media_id
      in: path
      required: true
      schema:
        type: string
        description: Media ID returned by the upload route.
        example: "100000000000003"
    QrId:
      name: qr_code_id
      in: path
      required: true
      schema:
        type: string
        description: Code returned when the sandbox QR record was created.
        example: "100000000000004"
    ImageFormat:
      name: format
      in: path
      required: true
      schema:
        type: string
        description: The format chosen when creating or updating the QR record.
        example: png
        enum: [png, svg]
    WebhookService:
      name: service
      in: path
      required: true
      schema:
        type: string
        description: Provider channel.
        example: sms
        enum: [sms, otp, whatsapp, rcs, voice]
    WebhookId:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: ID returned by webhook creation.
        example: wh_123456
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        description: "First date, inclusive, in Asia/Kolkata."
        format: date
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        description: "Last date, inclusive, in Asia/Kolkata."
        format: date
    Page:
      name: page
      in: query
      schema:
        type: integer
        description: One-based page number.
        example: 1
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        description: Rows per page.
        example: 100
        minimum: 1
        maximum: 1000
        default: 100
    Fields:
      name: fields
      in: query
      schema:
        type: string
        description: Comma-separated names of fields to return.
  responses:
    Unauthorized:
      description: Missing or invalid sandbox API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            return: false
            status_code: 412
            message: "Invalid Authentication, Check Authorization Key"
    BadRequest:
      description: The request fields or body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    FieldBadRequest:
      description: The request failed validation. Field errors may identify individual inputs.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ApiError"
              - $ref: "#/components/schemas/FieldError"
    NotFound:
      description: The requested resource is unavailable for the authenticated sandbox account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The write conflicted with a concurrent request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationFailed:
      description: The date range or campaign input failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Accepted:
      description: Saved and queued for sandbox email delivery.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Accepted"
    SmsAccepted:
      description: Saved and queued for sandbox email delivery.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SmsAccepted"
    OtpSent:
      description: Saved the code and queued a sandbox email.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OtpSent"
    OtpVerified:
      description: Verified the most recent code for this number.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OtpVerified"
    Success:
      description: The request succeeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Success"
    SuccessData:
      description: The sandbox resource was saved or read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessData"
    DataList:
      description: The requested sandbox resources.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DataList"
    WhatsAppMetaAccepted:
      description: Saved and queued. The returned Meta-style ID can be used in the WhatsApp delivery report.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppMetaAccepted"
    VoiceCampaignAccepted:
      description: Saved and queued for simulated voice delivery by email.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VoiceCampaignAccepted"
    VoiceFiles:
      description: Approved sample voice files.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VoiceFiles"
    VoiceReport:
      description: Campaign state and optional per-number results.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VoiceReport"
    SmsDelivery:
      description: Delivery state derived from the sandbox email queue.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SmsDelivery"
    SmsLogs:
      description: Paginated sandbox delivery history.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SmsLogs"
    SmsSummary:
      description: Delivery counts for the requested date range.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SmsSummary"
    WhatsAppDelivery:
      description: Delivery state derived from the sandbox email queue.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppDelivery"
    WhatsAppLogs:
      description: Paginated sandbox delivery history.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppLogs"
    WhatsAppSummary:
      description: Delivery counts for the requested date range.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppSummary"
    Wallet:
      description: Configured sandbox wallet balance.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Wallet"
    DltList:
      description: Saved sender IDs or content templates.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DltList"
    DltImportResult:
      description: Accepted the workbook upload or recorded its URL.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DltImportResult"
    WabaDetails:
      description: Sandbox WABA details with optional templates.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WabaDetails"
    WhatsAppTemplateList:
      description: Matching templates and cursor paging when available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppTemplateList"
    WhatsAppPhoneList:
      description: Matching phone numbers and cursor metadata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppPhoneList"
    WhatsAppProfileList:
      description: Business profile data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppProfileList"
    WhatsAppTemplateCreated:
      description: Stored the template with local sandbox approval.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppTemplateCreated"
    WhatsAppObject:
      description: "Phone, business health, or template fields for the supplied ID."
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/WhatsAppPhone"
              - $ref: "#/components/schemas/WhatsAppHealth"
              - $ref: "#/components/schemas/WhatsAppTemplate"
    WhatsAppMediaReference:
      description: Uploaded the file and returned its ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppMediaReference"
    WhatsAppMediaHandle:
      description: Uploaded the file and returned a handle.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppMediaHandle"
    WhatsAppMediaInfo:
      description: Stored metadata and protected download URL.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppMediaInfo"
    WhatsAppQr:
      description: Saved the sandbox QR record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppQr"
    WhatsAppQrList:
      description: Matching sandbox QR records.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppQrList"
    WhatsAppBlockedList:
      description: Sandbox block list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppBlockedList"
    WhatsAppBlocked:
      description: Updated the sandbox block list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppBlocked"
    WhatsAppUnblocked:
      description: Removed the users from the sandbox block list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WhatsAppUnblocked"
    WebhookList:
      description: Saved webhook configurations.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookList"
    WebhookSaved:
      description: Stored the webhook configuration.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookSaved"
    WebhookDeleted:
      description: Soft-deleted the webhook configuration.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookDeleted"
    Health:
      description: The application is accepting requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
  schemas:
    ApiError:
      type: object
      required: [return, status_code, message]
      properties:
        return:
          type: boolean
          example: false
        status_code:
          type: integer
          description: Fast2SMS-style status code.
          example: 400
        message:
          type: string
          example: Invalid request parameters or body
    FieldError:
      type: object
      required: [return, errors_keys, errors]
      properties:
        return:
          type: boolean
          example: false
        errors_keys:
          type: array
          items:
            type: string
          example: [message_id]
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            message_id: [Invalid WhatsApp template message ID]
    SmsDetails:
      type: object
      properties:
        character_count:
          type: integer
          example: 18
        per_sms_rate:
          type: string
          example: "0.0000"
        sms_count:
          type: integer
          example: 1
        sms_language:
          type: string
          enum: [english, unicode]
        total_valid_number:
          type: integer
          example: 1
        total_invalid_number:
          type: integer
          example: 0
        valid_numbers:
          type: array
          items:
            type: string
        invalid_numbers:
          type: array
          items:
            type: string
        amount_debited:
          type: string
          example: "0.0000"
    Accepted:
      type: object
      required: [return, request_id, message]
      properties:
        return:
          type: boolean
          example: true
        request_id:
          type: string
          description: Use this ID to look up the sandbox delivery state.
          example: S1234567890abcd
        message:
          type: array
          items:
            type: string
          example: [SMS sent successfully.]
        sms_details:
          type: object
          description: Present when requested. Its fields depend on the send route.
          additionalProperties: true
    SmsAccepted:
      type: object
      required: [return, request_id, message]
      properties:
        return:
          type: boolean
          example: true
        request_id:
          type: string
          description: Use this ID to look up the sandbox delivery state.
          example: S1234567890abcd
        message:
          type: array
          items:
            type: string
          example: [SMS sent successfully.]
        sms_details:
          $ref: "#/components/schemas/SmsDetails"
    OtpSent:
      type: object
      required: [return, status_code, request_id, message]
      properties:
        return:
          type: boolean
          example: true
        status_code:
          type: integer
          example: 200
        request_id:
          type: string
          example: O1234567890abcd
        message:
          type: string
          example: OTP sent successfully
    OtpVerified:
      type: object
      required: [return, status_code, message]
      properties:
        return:
          type: boolean
          example: true
        status_code:
          type: integer
          example: 200
        message:
          type: string
          example: OTP verified successfully
    Success:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
    SuccessData:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
    DataList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    CursorPage:
      type: object
      properties:
        cursors:
          type: object
          properties:
            before:
              type: string
              description: Previous cursor.
            after:
              type: string
              description: Next cursor.
    QuickSmsRequest:
      type: object
      required: [route, numbers, message]
      properties:
        route:
          type: string
          enum: [q]
        numbers:
          type: string
          description: Comma-separated Indian mobile numbers.
          example: "9999999999"
        message:
          type: string
          description: Plain SMS text.
          example: Hello from the sandbox
        schedule_time:
          type: string
          description: "Future time in Asia/Kolkata as DD-MM-YYYY-HH-MM, or Unix seconds."
        sms_details:
          type: string
          description: Set to 1 to include message details.
          example: "1"
          enum: ["1"]
        udf1:
          type: string
          description: First tracking value
        udf2:
          type: string
          description: Second tracking value
        udf3:
          type: string
          description: Third tracking value
    DltSmsRequest:
      type: object
      required: [route, numbers, sender_id, message]
      properties:
        route:
          type: string
          enum: [dlt]
        numbers:
          type: string
          description: Comma-separated Indian mobile numbers.
          example: "9999999999"
        sender_id:
          type: string
          description: DLT sender ID.
          example: TESTER
        message:
          type: string
          description: DLT Manager message ID.
          example: "10001"
        variables_values:
          type: string
          description: Pipe-delimited template values.
          example: "Sandbox|123456"
        schedule_time:
          type: string
          description: "Future time in Asia/Kolkata as DD-MM-YYYY-HH-MM, or Unix seconds."
        sms_details:
          type: string
          description: Set to 1 to include message details.
          example: "1"
          enum: ["1"]
        udf1:
          type: string
          description: First tracking value
        udf2:
          type: string
          description: Second tracking value
        udf3:
          type: string
          description: Third tracking value
    DltManualSmsRequest:
      type: object
      required: [route, numbers, sender_id, message]
      properties:
        route:
          type: string
          enum: [dlt_manual]
        numbers:
          type: string
          description: Comma-separated Indian mobile numbers.
          example: "9999999999"
        sender_id:
          type: string
          description: DLT sender ID.
          example: TESTER
        message:
          type: string
          description: Full DLT-approved text with values inserted.
        entity_id:
          type: string
          description: DLT principal entity ID.
        template_id:
          type: string
          description: DLT template ID.
        schedule_time:
          type: string
          description: "Future time in Asia/Kolkata as DD-MM-YYYY-HH-MM, or Unix seconds."
        sms_details:
          type: string
          description: Set to 1 to include message details.
          example: "1"
          enum: ["1"]
        udf1:
          type: string
          description: First tracking value
        udf2:
          type: string
          description: Second tracking value
        udf3:
          type: string
          description: Third tracking value
    ClassicOtpSmsRequest:
      type: object
      required: [route, numbers, variables_values]
      properties:
        route:
          type: string
          enum: [otp]
        numbers:
          type: string
          description: Comma-separated Indian mobile numbers.
          example: "9999999999"
        variables_values:
          type: string
          description: OTP value to send.
          example: "123456"
        schedule_time:
          type: string
          description: "Future time in Asia/Kolkata as DD-MM-YYYY-HH-MM, or Unix seconds."
        sms_details:
          type: string
          description: Set to 1 to include message details.
          example: "1"
          enum: ["1"]
        udf1:
          type: string
          description: First tracking value
        udf2:
          type: string
          description: Second tracking value
        udf3:
          type: string
          description: Third tracking value
    SmsBatchRequest:
      type: object
      required: [route, requests]
      properties:
        route:
          type: string
          enum: [q, dlt, dlt_manual]
        requests:
          type: array
          items:
            type: object
            required: [numbers, message]
            properties:
              numbers:
                type: string
                description: Comma-separated Indian mobile numbers.
                example: "9999999999"
              message:
                type: string
                description: "Quick SMS text, full DLT Manual text, or the Fast2SMS DLT message ID."
                example: Hello from the sandbox
              sender_id:
                type: string
                description: DLT sender ID.
                example: TESTER
              entity_id:
                type: string
                description: DLT principal entity ID.
              template_id:
                type: string
                description: DLT template ID.
              variables_values:
                type: string
                description: Pipe-delimited template values.
                example: "Sandbox|123456"
              schedule_time:
                type: string
                description: "Future time in Asia/Kolkata as DD-MM-YYYY-HH-MM, or Unix seconds."
              udf1:
                type: string
                description: First tracking value
              udf2:
                type: string
                description: Second tracking value
              udf3:
                type: string
                description: Third tracking value
          minItems: 1
        schedule_time:
          type: string
          description: "Future time in Asia/Kolkata as DD-MM-YYYY-HH-MM, or Unix seconds."
        sms_details:
          type: string
          description: Set to 1 to include message details.
          example: "1"
          enum: ["1"]
        udf1:
          type: string
          description: First tracking value
        udf2:
          type: string
          description: Second tracking value
        udf3:
          type: string
          description: Third tracking value
    SendOtpRequest:
      type: object
      required: [mobile, otp_id]
      properties:
        mobile:
          type: string
          description: "Indian mobile number. An optional 91 or +91 prefix is accepted."
          example: "9999999999"
        otp_id:
          type: string
          description: Sandbox OTP template ID.
          example: sandbox-otp
        otp:
          type: string
          description: Optional test code. Supply a string to retain leading zeros.
          example: "012345"
          maxLength: 10
        otp_length:
          type: integer
          description: Generated code length.
          example: 6
          minimum: 4
          maximum: 10
          default: 6
        otp_expiry:
          type: integer
          description: Minutes of validity.
          example: 15
          minimum: 1
          maximum: 10080
          default: 15
        variables_values:
          type: string
          description: Pipe-delimited template values.
          example: "Sandbox|123456"
        udf1:
          type: string
          description: First tracking value
        udf2:
          type: string
          description: Second tracking value
        udf3:
          type: string
          description: Third tracking value
    VerifyOtpRequest:
      type: object
      required: [mobile, otp]
      properties:
        mobile:
          type: string
          description: "Indian mobile number. An optional 91 or +91 prefix is accepted."
          example: "9999999999"
        otp:
          type: string
          description: Code from the sandbox email.
          example: "012345"
    ResendOtpRequest:
      type: object
      required: [mobile]
      properties:
        mobile:
          type: string
